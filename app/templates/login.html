{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="flex bg-white">
        <img class="mb-2 w-[1093px] " src="{{ url_for('static', filename='images/base.png') }}" alt="Deskripsi Gambar">
        <div class="w-full min-h-screen bg-white p-6 rounded shadow-md">
            <div class="mb-20">
                <div class="flex items-center justify-center">
                    <img class="mb-2" src="{{ url_for('static', filename='images/logo-login.png') }}" alt="Deskripsi Gambar">
                </div>
                <h1 class="text-3xl underline font-semibold text-center">Welcome Back</h1>
                <h1 class="text-lg underline text-center">Sign in to access your account</h1>
            </div>
            <form method="POST" action="{{ url_for('main.login') }}" class="bg-white space-y-[25px]">
                {{ form.hidden_tag() }}
                <div class="">
                    <input id="email" type="email" name="email" class="appearance-none rounded bg-[#C4C4C433] w-full py-[17px] px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline placeholder:undeline" placeholder="Enter your email...">
                </div>
                
                <div class="">
                    <input id="password" type="password" name="password" class="appearance-none rounded bg-[#C4C4C433] w-full py-[17px] px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline placeholder:undeline" placeholder="Password...">
                </div>
                
                <div class="mb-4">
                    <button type="submit" class="bg-[#252525] text-[#F9C679] w-full text-2xl font-semibold py-[17px] rounded underline hover:bg-slate-700">
                        Sign In
                    </button>
                </div>
                <div class="flex gap-2 items-center justify-center">
                    <h1 class="underline">New member?</h1>
                    <a href="{{ url_for('main.register') }}"  class="text-[#F9C679] font-bold">Register Now</a>
                </div>
                
            </form>
        </div>
    </div>
{% endblock %}
